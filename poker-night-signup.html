<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Thursday Night Poker</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --felt-dark:#0c3a2b;
  --felt:#12563f;
  --felt-light:#1a7052;
  --wood:#101d17;
  --wood-light:#22362c;
  --gold:#d4af37;
  --gold-soft:#e6c866;
  --cream:#f3ecda;
  --cream-dim:#c9bfa5;
  --brick:#a8452f;
  --brick-soft:#c65f45;
  --empty:rgba(243,236,218,0.10);
  --empty-border:rgba(243,236,218,0.22);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at 50% -12%, rgba(26,112,82,0.22) 0%, transparent 55%),
    var(--wood);
  color:var(--cream);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding:28px 16px 60px;
}

@media (max-width: 480px){
  body{ padding:18px 8px 40px; }
  .wrap{ max-width:100%; }
  .eyebrow{ font-size:12px; }
  .date-line{ font-size:15.5px; margin-bottom:4px; }
  .venue-line{ font-size:12.5px; margin-bottom:22px; gap:8px; }
  .status{ font-size:21px; padding:16px 14px; }
  .status .sub{ font-size:13.5px; }
  .join input{ font-size:16px; padding:14px 14px; }
  .join button{ font-size:15.5px; padding:0 18px; }
  .dealer-plate{ font-size:14.5px; padding:10px 18px; }
  .dealer-plate.unset{ font-size:14px; }
  .table-frame{ aspect-ratio:15/13; }
  .seat{ width:66px; }
  .seat .chip{ width:50px; height:50px; font-size:15px; }
  .seat .name{ font-size:12.5px; }
  .felt-center .count{ font-size:clamp(32px,9vw,44px); }
  .section-label{ font-size:16.5px; }
  .bench-list li{ font-size:16px; padding:12px 14px; }
  .footer-row{ font-size:13px; }
}

.wrap{max-width:640px;margin:0 auto;}

.eyebrow{
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold-soft);
  text-align:center;
  margin-bottom:6px;
  font-weight:600;
}

h1{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:clamp(28px,6vw,40px);
  text-align:center;
  margin:0 0 4px;
  letter-spacing:-.01em;
}

.date-line{
  text-align:center;
  color:var(--cream-dim);
  font-size:14px;
  margin-bottom:6px;
}

.venue-line{
  text-align:center;
  color:var(--gold-soft);
  font-size:12px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin-bottom:26px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.venue-line:hover{color:var(--gold);}
.venue-line .tiger-mark{
  width:26px;height:16px;
  flex-shrink:0;
  opacity:.85;
}
.venue-line .rule{
  width:20px;height:1px;
  background:rgba(230,200,102,0.4);
}

/* Status banner */
.status{
  border-radius:14px;
  padding:16px 18px;
  text-align:center;
  margin-bottom:26px;
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:19px;
  border:1px solid transparent;
  transition:background .3s ease;
}
.status.on{
  background:linear-gradient(135deg,#1a6b4a,#12563f);
  border-color:rgba(212,175,55,0.35);
  box-shadow:0 0 0 1px rgba(212,175,55,0.15) inset;
}
.status.waiting{
  background:rgba(168,69,47,0.18);
  border-color:rgba(168,69,47,0.4);
  color:var(--cream);
}
.status .sub{
  font-family:'Inter',sans-serif;
  font-weight:400;
  font-size:12.5px;
  color:var(--cream-dim);
  margin-top:3px;
}

/* Join form */
.join{
  display:flex;
  gap:8px;
  margin-bottom:34px;
}
.join input{
  flex:1;
  background:rgba(243,236,218,0.07);
  border:1px solid rgba(243,236,218,0.25);
  border-radius:10px;
  padding:12px 14px;
  color:var(--cream);
  font-size:15px;
  font-family:'Inter',sans-serif;
  outline:none;
}
.join input::placeholder{color:var(--cream-dim);}
.join input:focus{border-color:var(--gold);}
.join button{
  background:var(--gold);
  color:var(--wood);
  border:none;
  border-radius:10px;
  padding:0 20px;
  font-weight:700;
  font-size:14.5px;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  transition:transform .12s ease,background .12s ease;
  white-space:nowrap;
}
.join button:hover{background:var(--gold-soft);transform:translateY(-1px);}
.join button:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* Table — the signature element */
.dealer-zone{
  display:flex;
  justify-content:center;
  position:relative;
  z-index:6;
  margin-bottom:-10px;
}
.dealer-plate{
  display:flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(180deg,#f6f0de,#dcd2b2);
  color:var(--wood);
  padding:9px 18px;
  border-radius:9px;
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:13px;
  letter-spacing:.03em;
  box-shadow:0 8px 18px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(36,21,16,0.35);
  cursor:pointer;
  position:relative;
  transition:transform .12s ease;
}
.dealer-plate:hover{transform:translateY(-1px);}
.dealer-plate.unset{
  background:var(--empty);
  color:var(--cream-dim);
  border:2px dashed var(--empty-border);
  box-shadow:none;
  font-weight:600;
  font-family:'Inter',sans-serif;
  font-size:12.5px;
}
.dealer-plate .dot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--brick);
  flex-shrink:0;
}
.dealer-plate.set .dot{background:#2e7d4f;}
.dealer-plate .dealer-remove{
  position:absolute;
  top:-7px; right:-7px;
  width:19px;height:19px;
  border-radius:50%;
  background:var(--brick);
  color:var(--cream);
  border:2px solid var(--wood);
  font-size:11px;
  line-height:1;
  cursor:pointer;
  display:none;
  align-items:center;justify-content:center;
}
.dealer-plate.set:hover .dealer-remove{display:flex;}

.table-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/11;
  margin:0 auto 30px;
}
.rail{
  position:absolute;
  inset:0;
  border-radius:48%/58%;
  background:linear-gradient(180deg,var(--wood-light),var(--wood));
  box-shadow:0 12px 30px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(212,175,55,0.25);
}
.felt{
  position:absolute;
  inset:5.5%;
  border-radius:48%/58%;
  background:
    radial-gradient(ellipse at 50% 38%, var(--felt-light) 0%, var(--felt) 55%, var(--felt-dark) 100%);
  box-shadow:inset 0 0 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(212,175,55,0.15);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.felt-center{
  font-family:'Fraunces',serif;
}
.felt-center .count{
  font-size:clamp(30px,7vw,44px);
  font-weight:700;
  line-height:1;
  color:var(--gold-soft);
}
.felt-center .count span{color:var(--cream-dim);font-size:.5em;font-weight:500;}
.felt-center .label{
  font-family:'Inter',sans-serif;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--cream-dim);
  margin-top:4px;
}

.seat{
  position:absolute;
  width:78px;
  transform:translate(-50%,-50%);
  text-align:center;
}
.seat .chip{
  width:52px;height:52px;
  margin:0 auto 5px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:16px;
  position:relative;
  cursor:default;
}
.seat.filled .chip{
  background:linear-gradient(145deg,var(--gold-soft),var(--gold));
  color:var(--wood);
  box-shadow:0 4px 10px rgba(0,0,0,0.4), inset 0 0 0 3px rgba(255,255,255,0.25);
}
.seat.empty .chip{
  background:var(--empty);
  border:2px dashed var(--empty-border);
  color:var(--cream-dim);
  font-size:11px;
  font-weight:500;
  font-family:'Inter',sans-serif;
}
.seat .name{
  font-size:12px;
  font-weight:600;
  color:var(--cream);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  padding:0 2px;
}
.seat .remove{
  position:absolute;
  top:-4px; right:-4px;
  width:19px;height:19px;
  border-radius:50%;
  background:var(--brick);
  color:var(--cream);
  border:2px solid var(--wood);
  font-size:11px;
  line-height:1;
  cursor:pointer;
  display:none;
  align-items:center;justify-content:center;
}
.seat.filled:hover .remove{display:flex;}

/* Bench */
.section-label{
  font-family:'Fraunces',serif;
  font-size:15px;
  font-weight:600;
  color:var(--gold-soft);
  margin:0 0 12px;
  display:flex;
  align-items:baseline;
  gap:8px;
}
.section-label .n{
  font-family:'Inter',sans-serif;
  font-size:11px;
  color:var(--cream-dim);
  font-weight:500;
}
.bench-list{
  list-style:none;
  margin:0 0 30px;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.bench-list li{
  background:rgba(243,236,218,0.05);
  border:1px solid rgba(243,236,218,0.15);
  border-radius:10px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  font-size:14.5px;
}
.bench-list .pos{
  font-family:'Fraunces',serif;
  font-weight:700;
  color:var(--gold);
  min-width:18px;
}
.bench-list .bname{flex:1;}
.bench-list .bremove{
  background:none;
  border:none;
  color:var(--cream-dim);
  cursor:pointer;
  font-size:13px;
  padding:4px 8px;
}
.bench-list .bremove:hover{color:var(--brick-soft);}
.empty-bench{
  color:var(--cream-dim);
  font-size:13.5px;
  font-style:italic;
  padding:6px 2px 30px;
}

.footer-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--cream-dim);
  font-size:12px;
}
.footer-row button{
  background:none;
  border:1px solid rgba(243,236,218,0.25);
  color:var(--cream-dim);
  border-radius:8px;
  padding:6px 12px;
  font-size:12px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
}
.footer-row button:hover{color:var(--cream);border-color:var(--cream-dim);}

.toast{
  position:fixed;
  bottom:20px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--brick);
  color:var(--cream);
  padding:10px 18px;
  border-radius:10px;
  font-size:13.5px;
  opacity:0;
  transition:all .25s ease;
  pointer-events:none;
  z-index:10;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Weekly Game</div>
  <h1>Thursday Night Poker</h1>
  <div class="date-line" id="dateLine">loading…</div>
  <div class="venue-line" id="venueLine">
    <span class="rule"></span>
    <svg class="tiger-mark" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
      <g fill="currentColor">
        <ellipse cx="46" cy="26" rx="24" ry="9"/>
        <circle cx="76" cy="18" r="8"/>
        <path d="M70 11 L74 4 L77 12 Z"/>
        <path d="M22 24 Q6 20 4 30 Q10 26 22 30 Z"/>
        <rect x="26" y="32" width="4" height="14" rx="2"/>
        <rect x="36" y="34" width="4" height="12" rx="2"/>
        <rect x="58" y="34" width="4" height="12" rx="2"/>
        <rect x="66" y="32" width="4" height="14" rx="2"/>
      </g>
      <g stroke="#1d1b18" stroke-width="1.6" stroke-linecap="round">
        <line x1="36" y1="20" x2="40" y2="16"/>
        <line x1="44" y1="19" x2="48" y2="15"/>
        <line x1="52" y1="20" x2="56" y2="17"/>
      </g>
    </svg>
    <span id="venueText">House of Tiger</span>
    <span class="rule"></span>
  </div>

  <div class="status waiting" id="statusBanner">
    <div id="statusMain">Checking the table…</div>
    <div class="sub" id="statusSub"></div>
  </div>

  <div class="join">
    <input id="nameInput" type="text" maxlength="24" placeholder="Your name" autocomplete="off">
    <button id="joinBtn">I'm in</button>
  </div>

  <div class="dealer-zone">
    <div class="dealer-plate unset" id="dealerPlate">
      <span class="dot"></span>
      <span id="dealerText">+ Confirm dealer</span>
      <div class="dealer-remove" id="dealerRemove">✕</div>
    </div>
  </div>

  <div class="table-frame">
    <div class="rail"></div>
    <div class="felt">
      <div class="felt-center">
        <div class="count" id="seatCount">0<span>/9</span></div>
        <div class="label">seated</div>
      </div>
    </div>
    <div id="seatsLayer"></div>
  </div>

  <div class="section-label">Bench <span class="n" id="benchN">(0 waiting)</span></div>
  <div id="benchWrap"></div>

  <div class="footer-row">
    <span id="ruleLine">Max 9 seated · min 8 to confirm the game</span>
    <button id="refreshBtn">Refresh</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MAX_SEATS = 9;
const MIN_TO_CONFIRM = 8;
const DEFAULT_VENUE = 'House of Tiger';

function getNextThursday(){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const day = d.getDay(); // 0 Sun ... 4 Thu ... 6 Sat
  const diff = (4 - day + 7) % 7; // 0 on Thursday itself, 6 on Friday → rolls to next Thursday
  d.setDate(d.getDate() + diff);
  return d;
}

function fmtDate(d){
  return d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
}

const nextThu = getNextThursday();
const weekKey = nextThu.toISOString().slice(0,10);

document.getElementById('dateLine').textContent = fmtDate(nextThu);

// ---- Firebase setup ----
const firebaseConfig = {
  apiKey: "AIzaSyAzz9zDNOZJSQCLBMFTqmLSSGsuayukiKE",
  authDomain: "thursday-night-poker.firebaseapp.com",
  databaseURL: "https://thursday-night-poker-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "thursday-night-poker",
  storageBucket: "thursday-night-poker.firebasestorage.app",
  messagingSenderId: "260663814594",
  appId: "1:260663814594:web:e4b4c692754351a8ff4e5b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const weekRef = db.ref('poker-signups/' + weekKey);

let state = { main: [], bench: [], dealer: '', venue: DEFAULT_VENUE };

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function seatPosition(i, total){
  // Leave a gap at the top (12 o'clock) for the dealer plate; space the
  // remaining seats evenly around the rest of the ellipse.
  const gap = (66 * Math.PI) / 180; // width of the dealer's empty zone
  const angleStart = -Math.PI/2 + gap/2;
  const step = (Math.PI * 2 - gap) / (total - 1);
  const angle = angleStart + step * i;
  const rx = 44, ry = 42;
  const x = 50 + rx * Math.cos(angle);
  const y = 50 + ry * Math.sin(angle);
  return { x, y };
}

function render(){
  const { main, bench, dealer, venue } = state;

  document.getElementById('venueText').textContent = venue || DEFAULT_VENUE;

  // dealer plate
  const plate = document.getElementById('dealerPlate');
  const plateText = document.getElementById('dealerText');
  if(dealer){
    plate.className = 'dealer-plate set';
    plateText.textContent = `Dealer — ${dealer}`;
  } else {
    plate.className = 'dealer-plate unset';
    plateText.textContent = '+ Confirm dealer';
  }

  // status banner
  const banner = document.getElementById('statusBanner');
  const mainLine = document.getElementById('statusMain');
  const subLine = document.getElementById('statusSub');
  if(main.length >= MIN_TO_CONFIRM){
    banner.className = 'status on';
    mainLine.textContent = main.length === MAX_SEATS ? '🂡 Table is full — game is ON' : '🂡 Game is ON';
    subLine.textContent = main.length < MAX_SEATS ? `${MAX_SEATS - main.length} seat${MAX_SEATS-main.length===1?'':'s'} still open` : 'No seats left';
  } else {
    banner.className = 'status waiting';
    const need = MIN_TO_CONFIRM - main.length;
    mainLine.textContent = `Need ${need} more to confirm`;
    subLine.textContent = `${main.length} of ${MIN_TO_CONFIRM} minimum committed`;
  }

  document.getElementById('seatCount').innerHTML = `${main.length}<span>/${MAX_SEATS}</span>`;

  // seats
  const layer = document.getElementById('seatsLayer');
  layer.innerHTML = '';
  for(let i=0;i<MAX_SEATS;i++){
    const pos = seatPosition(i, MAX_SEATS);
    const seatEl = document.createElement('div');
    seatEl.className = 'seat ' + (i < main.length ? 'filled' : 'empty');
    seatEl.style.left = pos.x + '%';
    seatEl.style.top = pos.y + '%';
    if(i < main.length){
      const nm = main[i];
      seatEl.innerHTML = `
        <div class="chip">${initials(nm)}<div class="remove" data-name="${escapeAttr(nm)}" data-list="main">✕</div></div>
        <div class="name">${escapeHtml(nm)}</div>`;
    } else {
      seatEl.innerHTML = `<div class="chip">Open</div><div class="name">&nbsp;</div>`;
    }
    layer.appendChild(seatEl);
  }

  // bench
  document.getElementById('benchN').textContent = `(${bench.length} waiting)`;
  const benchWrap = document.getElementById('benchWrap');
  if(bench.length === 0){
    benchWrap.innerHTML = `<div class="empty-bench">No one on the bench right now.</div>`;
  } else {
    const ul = document.createElement('ul');
    ul.className = 'bench-list';
    bench.forEach((nm, idx)=>{
      const li = document.createElement('li');
      li.innerHTML = `<span class="pos">${idx+1}</span><span class="bname">${escapeHtml(nm)}</span><button class="bremove" data-name="${escapeAttr(nm)}" data-list="bench">remove</button>`;
      ul.appendChild(li);
    });
    benchWrap.innerHTML = '';
    benchWrap.appendChild(ul);
  }

  layer.querySelectorAll('.remove').forEach(btn=>{
    btn.addEventListener('click', onRemoveClick);
  });
  benchWrap.querySelectorAll('.bremove').forEach(btn=>{
    btn.addEventListener('click', onRemoveClick);
  });
}

function initials(name){
  const parts = name.trim().split(/\s+/);
  const s = parts.length > 1 ? (parts[0][0] + parts[1][0]) : parts[0].slice(0,2);
  return s.toUpperCase();
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

// Live listener: fires immediately with current data, then again on every change from anyone
weekRef.on('value', (snapshot) => {
  const val = snapshot.val();
  state = { main: (val && val.main) || [], bench: (val && val.bench) || [], dealer: (val && val.dealer) || '', venue: (val && val.venue) || DEFAULT_VENUE };
  render();
}, (err) => {
  showToast("Couldn't connect — check your connection");
});

async function saveState(){
  try{
    await weekRef.set(state);
  }catch(e){
    showToast("Couldn't save — try again");
  }
}

function findExisting(name){
  const lower = name.toLowerCase();
  return state.main.some(n=>n.toLowerCase()===lower) || state.bench.some(n=>n.toLowerCase()===lower);
}

async function joinGame(){
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if(!name) return;
  if(findExisting(name)){
    showToast(`${name} is already on the list`);
    return;
  }
  if(state.main.length < MAX_SEATS){
    state.main.push(name);
    showToast(`${name} took a seat`);
  } else {
    state.bench.push(name);
    showToast(`${name} added to the bench`);
  }
  input.value = '';
  await saveState();
  render();
}

async function removeName(name, list){
  if(list === 'main'){
    state.main = state.main.filter(n=>n!==name);
    // bump next bench player up
    if(state.bench.length > 0 && state.main.length < MAX_SEATS){
      const promoted = state.bench.shift();
      state.main.push(promoted);
      showToast(`${name} dropped out — ${promoted} bumped up from the bench`);
    } else {
      showToast(`${name} dropped out`);
    }
  } else {
    state.bench = state.bench.filter(n=>n!==name);
    showToast(`${name} left the bench`);
  }
  await saveState();
  render();
}

function onRemoveClick(e){
  const btn = e.currentTarget;
  const name = btn.getAttribute('data-name');
  const list = btn.getAttribute('data-list');
  const spot = list === 'main' ? 'the table' : 'the bench';
  if(!window.confirm(`Remove ${name} from ${spot}?`)) return;
  removeName(name, list);
}

document.getElementById('joinBtn').addEventListener('click', joinGame);
document.getElementById('nameInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') joinGame();
});
document.getElementById('refreshBtn').addEventListener('click', ()=>{
  weekRef.once('value').then(snap=>{
    const val = snap.val();
    state = { main: (val && val.main) || [], bench: (val && val.bench) || [], dealer: (val && val.dealer) || '', venue: (val && val.venue) || DEFAULT_VENUE };
    render();
    showToast('Refreshed');
  });
});

document.getElementById('venueLine').addEventListener('click', async ()=>{
  const name = window.prompt("Where's the game this week?", state.venue || DEFAULT_VENUE);
  if(name === null) return; // cancelled
  const trimmed = name.trim();
  state.venue = trimmed || DEFAULT_VENUE;
  await saveState();
  render();
  showToast(`Venue set to ${state.venue}`);
});

document.getElementById('dealerPlate').addEventListener('click', async (e)=>{
  if(e.target.id === 'dealerRemove'){
    e.stopPropagation();
    const was = state.dealer;
    if(!window.confirm(`Clear ${was} as dealer?`)) return;
    state.dealer = '';
    await saveState();
    render();
    showToast(`${was} is no longer dealing`);
    return;
  }
  const name = window.prompt("Who's dealing tonight?", state.dealer || '');
  if(name === null) return; // cancelled
  const trimmed = name.trim();
  state.dealer = trimmed;
  await saveState();
  render();
  if(trimmed) showToast(`${trimmed} confirmed as dealer`);
});
</script>
</body>
</html>
